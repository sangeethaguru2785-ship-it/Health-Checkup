<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#062b34" />
    <meta name="description" content="Page not found - Stackly Health Checkup Center." />
    <meta name="robots" content="noindex" />
    <title>Page Not Found &mdash; Stackly</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

    <!-- ===================== PRELOADER ===================== -->
    <div class="preloader" id="preloader">
        <div class="preloader__inner">
            <svg class="preloader__pulse" viewBox="0 0 120 40" role="img" aria-label="Loading">
                <polyline points="0,20 22,20 30,6 40,34 50,20 120,20" />
            </svg>
            <img class="preloader__brand-logo" src="assets/img/logo.webp" alt="Stackly" width="1200" height="493" />
            <div class="preloader__bar"><i></i></div>
        </div>
    </div>

    <!-- ===================== 404 ===================== -->
    <main class="error-page" id="errorPage">
        <div class="error-page__bg">
            <span class="error-page__blob error-page__blob--1"></span>
            <span class="error-page__blob error-page__blob--2"></span>
            <span class="error-page__grid"></span>
        </div>

        <div class="container">
            <div class="error-page__inner">
                <a class="error-page__logo" href="index.html" aria-label="Stackly home">
                    <img class="brand-logo" src="assets/img/logo.webp" alt="Stackly Health Checkup Center" width="1200" height="493" />
                </a>
                <p class="error-page__code">404</p>
                <svg class="error-page__pulse" viewBox="0 0 200 54" preserveAspectRatio="none" aria-hidden="true">
                    <polyline points="0,27 60,27 74,8 88,46 102,27 200,27" />
                </svg>
                <h1 class="error-page__title">This page took a wrong turn</h1>
                <p class="error-page__text">
                    The page you are looking for could not be found. It may have moved, or the
                    link you followed is no longer active. Let us guide you back to good health.
                </p>
                <div class="error-page__actions">
                    <a href="index.html" class="btn btn-brand btn-lg">
                        <i class="bi bi-house-heart-fill"></i> Go to Home
                    </a>
                    <button type="button" class="btn btn-ghost btn-lg" id="goBack">
                        <i class="bi bi-arrow-left"></i> Go Back
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- ===================== BACK TO TOP ===================== -->
    <button class="back-top" id="backTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.documentElement.classList.add('has-js');
        window.addEventListener('DOMContentLoaded', function () {
            var page = document.getElementById('errorPage');
            if (page) page.classList.add('is-ready');
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        var goBack = document.getElementById('goBack');
        if (goBack) {
            goBack.addEventListener('click', function () {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = 'index.html';
                }
            });
        }
    </script>
</body>
</html>
